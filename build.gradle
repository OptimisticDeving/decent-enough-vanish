plugins {
  id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

loom.serverOnlyMinecraftJar()

repositories {
  maven { url = uri('https://maven.parchmentmc.org/') }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings loom.layered {
    officialMojangMappings()
    parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
  }
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

  modImplementation fabricApi.module(
    'fabric-command-api-v2',
    project.fabric_version
  )
}

processResources {
  filesMatching(["fabric.mod.json", "decent-enough-vanish.mixins.json"]) {
    expand project.properties
  }
}

java {
  withSourcesJar()

  toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = java.toolchain.languageVersion.get().asInt()
  it.options.encoding = 'UTF-8'
}

jar {
  inputs.property 'archivesName', project.base.archivesName

  from('LICENSE') {
    rename { "${it}_${inputs.properties.archivesName}" }
  }
}